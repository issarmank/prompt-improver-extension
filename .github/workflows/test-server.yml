# Runs the server's build and tests against a real Redis on every push to
# main and every PR that touches the server. Deploys come from Vercel's Git
# integration (project prompt-polish-server, Root Directory server/); its
# Deployment Checks wait for this `test` job before promoting to production.
name: test-server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-server.yml'

permissions:
  contents: read

concurrency:
  group: test-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @prompt-polish/server
      - run: npm test --workspace @prompt-polish/server
