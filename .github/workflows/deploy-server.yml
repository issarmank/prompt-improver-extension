# Builds the server image in ACR and rolls it out to the Container App on
# every push to main that touches the server (deploy-on-main chosen over
# tags so the app tracks the branch the extension is developed against).
#
# Required repository secrets:
#   AZURE_CREDENTIALS      — service principal JSON for azure/login
#   ACR_NAME               — registry name (the <name> in <name>.azurecr.io)
#   AZURE_RESOURCE_GROUP   — resource group holding the Container App
#   CONTAINERAPP_NAME      — the Container App to update
name: deploy-server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE_NAME: prompt-polish-server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @prompt-polish/server
      - run: npm test --workspace @prompt-polish/server

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # az acr build builds in the registry itself — no docker login or
      # buildx setup in the runner, and layers cache registry-side.
      - name: Build and push image
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "${IMAGE_NAME}:${{ github.sha }}" \
            --image "${IMAGE_NAME}:latest" \
            --file server/Dockerfile \
            .
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
